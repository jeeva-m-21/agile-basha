version: "3.8"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: basha-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgres://postgres:postgres@db:5432/agile_basha
      - SARVAM_API_KEY=${SARVAM_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: basha-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=agile_basha
    ports:
      - "5433:5432"
    volumes:
      - basha_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agile_basha"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  basha_postgres_data:
